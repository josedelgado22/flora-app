

services:
  db:
    image: postgres:15-alpine
    container_name: flora_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flora_db}
      POSTGRES_USER: ${POSTGRES_USER:-flora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flora_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flora_user} -d ${POSTGRES_DB:-flora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: flora_django_api
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://${POSTGRES_USER:-flora_user}:${POSTGRES_PASSWORD:-flora_secure_password_2026}@db:5432/${POSTGRES_DB:-flora_db}
      - ALLOWED_HOSTS=*
      - ROOT_URLCONF=config.urls
      - WSGI_APPLICATION=config.wsgi.application
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  media_volume:
    driver: local
  static_volume:
    driver: local